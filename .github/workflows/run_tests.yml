name: SwiftFormat
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # SwiftFormat only. The project is in the Xcode 27.0 format and GitHub's macOS runners
    # have Xcode 26 at most, which cannot open it, so the tests run locally before merging
    # (AGENTS.md "Testing"). Put the Xcode selection and the test step back once a runner
    # has Xcode 27.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftFormat
        run: |
          brew install swiftformat
      - name: SwiftFormat Lint
        run: |
          swiftformat --lint NativeAppTemplate
